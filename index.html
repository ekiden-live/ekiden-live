<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>チーム位置情報テスト</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: sans-serif;
      color: #222;
      background: #fff;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }

    #status {
      width: 100%;
      margin: 0 0 12px;
      padding: 10px;
      overflow-wrap: anywhere;
      background: #f2f2f2;
      border-radius: 6px;
    }

    #map {
      display: block;
      width: 100%;
      height: 60vh;
      min-height: 320px;
      max-height: 650px;
      border: 1px solid #aaa;
      border-radius: 6px;
      overflow: hidden;
    }

    .success {
      color: #075f23;
      background: #effff3 !important;
    }

    .error {
      color: #b00020;
      background: #fff0f0 !important;
    }

    @media (max-width: 600px) {
      main {
        padding: 8px;
      }

      #map {
        height: 55vh;
        min-height: 300px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>チーム位置情報テスト</h1>
    <p id="status">Supabaseから読み込み中...</p>
    <div id="map"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>
    const SUPABASE_URL =
      "https://tmxmmikcgzdcyyotkiex.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dSckTd34uKOP-zWHbfMsTg_pr74IBgb";

    const TEAM_ID = "鶴田A";

    const statusElement =
      document.getElementById("status");

    const map = L.map("map").setView(
      [31.906, 130.455],
      14
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          "OpenStreetMap</a> contributors"
      }
    ).addTo(map);

    function showError(message) {
      statusElement.textContent =
        "位置を取得できませんでした: " + message;

      statusElement.className = "error";
    }

    async function loadRemoteLocation() {
      try {
        if (
          !SUPABASE_KEY.startsWith("sb_publishable_")
        ) {
          throw new Error(
            "Publishable keyを入力してください。"
          );
        }

        const tablePath =
          "/rest/v1/team_locations";

        const query =
          "?select=team_id%2Clatitude%2Clongitude%2Caccuracy%2Crecorded_at" +
          "&team_id=eq." +
          encodeURIComponent(TEAM_ID) +
          "&order=recorded_at.desc" +
          "&limit=1";

        const endpoint =
          SUPABASE_URL + tablePath + query;

        const response = await fetch(endpoint, {
          method: "GET",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY,
            Accept: "application/json",
            "Accept-Profile": "public"
          }
        });

        if (!response.ok) {
          const text = await response.text();

          throw new Error(
            "HTTP " +
            response.status +
            ": " +
            text
          );
        }

        const rows = await response.json();

        if (
          !Array.isArray(rows) ||
          rows.length === 0
        ) {
          statusElement.textContent =
            "接続には成功しましたが、鶴田Aのデータがありません。";

          return;
        }

        const row = rows[0];
        const latitude = Number(row.latitude);
        const longitude = Number(row.longitude);
        const accuracy = Number(row.accuracy);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          throw new Error(
            "保存された緯度または経度が正しくありません。"
          );
        }

        const point = [
          latitude,
          longitude
        ];

        let accuracyText = "不明";

        if (Number.isFinite(accuracy)) {
          accuracyText =
            "約" + Math.round(accuracy) + "m";
        }

        let recordedAtText = "不明";

        if (row.recorded_at) {
          recordedAtText =
            new Date(row.recorded_at)
              .toLocaleString("ja-JP");
        }

        L.marker(point)
          .addTo(map)
          .bindPopup(
            "<strong>チーム: " +
            escapeHtml(row.team_id) +
            "</strong>" +
            "<br>精度: " +
            accuracyText +
            "<br>更新: " +
            recordedAtText
          )
          .openPopup();

        if (
          Number.isFinite(accuracy) &&
          accuracy >= 0
        ) {
          L.circle(point, {
            radius: accuracy,
            color: "#d93636",
            fillColor: "#d93636",
            fillOpacity: 0.15
          }).addTo(map);
        }

        map.setView(point, 17);

        setTimeout(function () {
          map.invalidateSize();
        }, 200);

        statusElement.textContent =
          "Supabaseからテスト位置を取得しました。";

        statusElement.className = "success";
      } catch (error) {
        console.error(error);
        showError(error.message);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener(
      "resize",
      function () {
        map.invalidateSize();
      }
    );

    loadRemoteLocation();

setInterval(function () {
  loadRemoteLocation();
}, 30000);

  </script>
</body>
</html>
