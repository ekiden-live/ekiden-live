<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>チーム位置情報テスト</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3ynhMZjoTvuQNMP3C1LsZxZlB2M="
    crossorigin=""
  >

  <style>
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      font-family: sans-serif;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      font-size: 1.5rem;
    }

    #status {
      padding: 10px;
      background: #f2f2f2;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    #map {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    .error {
      color: #b00020;
      background: #fff0f0 !important;
    }

    .success {
      color: #075f23;
      background: #effff3 !important;
    }
  </style>
</head>

<body>
  <h1>チーム位置情報テスト</h1>

  <p id="status">Supabaseから読み込み中...</p>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    /*
     * Project URLには /rest/v1 を付けません。
     * URL末尾の / も付けません。
     */
    const SUPABASE_URL =
      "https://tmxmmikcgzdcyyotkiex.supabase.co";

    /*
     * 下の文字だけ、新しく発行したPublishable keyへ
     * 書き換えてください。
     */
    const SUPABASE_KEY =
      "sb_publishable_dSckTd34uKOP-zWHbfMsTg_pr74IBgb";

    const TEAM_ID = "test-a";

    const statusElement = document.getElementById("status");

    const map = L.map("map").setView(
      [31.906, 130.455],
      14
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          "OpenStreetMap</a> contributors"
      }
    ).addTo(map);

    async function loadRemoteLocation() {
      try {
        if (
          SUPABASE_KEY ===
          "ここに新しいPublishable keyを入力"
        ) {
          throw new Error(
            "Publishable keyが未入力です。"
          );
        }

        const endpoint =
          `${SUPABASE_URL}/rest/v1/team_locations` +
          `?select=team_id%2Clatitude%2Clongitude%2Caccuracy%2Crecorded_at` +
          `&team_id=eq.${encodeURIComponent(TEAM_ID)}` +
          `&order=recorded_at.desc` +
          `&limit=1`;

        const response = await fetch(endpoint, {
          method: "GET",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          const message = await response.text();

          throw new Error(
            `HTTP ${response.status}: ${message}`
          );
        }

        const rows = await response.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          statusElement.textContent =
            `${TEAM_ID}の位置データがありません。`;
          return;
        }

        const row = rows[0];
        const latitude = Number(row.latitude);
        const longitude = Number(row.longitude);
        const accuracy = Number(row.accuracy);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          throw new Error(
            "緯度または経度が正しくありません。"
          );
        }

        const point = [latitude, longitude];

        const accuracyText =
          Number.isFinite(accuracy)
            ? `約${Math.round(accuracy)}m`
            : "不明";

        const recordedAtText =
          row.recorded_at
            ? new Date(row.recorded_at)
                .toLocaleString("ja-JP")
            : "不明";

        L.marker(point)
          .addTo(map)
          .bindPopup(
            `<strong>チーム: ${escapeHtml(row.team_id)}</strong>` +
            `<br>精度: ${accuracyText}` +
            `<br>更新: ${recordedAtText}`
          )
          .openPopup();

        if (
          Number.isFinite(accuracy) &&
          accuracy >= 0
        ) {
          L.circle(point, {
            radius: accuracy,
            color: "#d93636",
            fillColor: "#d93636",
            fillOpacity: 0.15
          }).addTo(map);
        }

        map.setView(point, 17);

        statusElement.textContent =
          "Supabaseからテスト位置を取得しました。";

        statusElement.classList.add("success");
      } catch (error) {
        console.error(error);

        statusElement.textContent =
          "位置を取得できませんでした: " +
          error.message;

        statusElement.classList.add("error");
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadRemoteLocation();
  </script>
</body>
</html>
