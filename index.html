<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>第22回さつま町駅伝競走大会 位置情報</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --primary: #154f7d;
      --primary-dark: #0d3555;
      --page-background: #eef2f5;
      --border: #d6dde3;
      --text: #1d2730;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: var(--page-background);
    }

    .page-header {
      padding: 24px 16px;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
      border-bottom: 5px solid #f2c94c;
    }

    .pc-only {
      display: block;
    }

    .sp-only {
      display: none;
    }

    .header-pc-layout {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) 120px;
      align-items: center;
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .header-character {
      grid-column: 1;
      justify-self: center;
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .header-text {
      grid-column: 2;
      min-width: 0;
      text-align: center;
    }

    .header-text h1,
    .header-text p {
      margin: 0;
      text-align: center;
    }
