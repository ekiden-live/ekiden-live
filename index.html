<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>駅伝GPS動作確認</title>

  <style>
    body {
      max-width: 640px;
      margin: auto;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.7;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      padding: 12px;
      background: #f2f2f2;
      border-left: 5px solid #777;
      font-weight: bold;
    }

    dl {
      padding: 16px;
      border: 1px solid #ccc;
    }

    dt {
      font-weight: bold;
    }

    dd {
      margin: 0 0 12px 0;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>駅伝GPS動作確認</h1>

  <button id="start" type="button">位置取得を開始</button>
  <button id="stop" type="button" disabled>位置取得を停止</button>

  <p id="status">停止中</p>

  <dl>
    <dt>緯度</dt>
    <dd id="latitude">-</dd>

    <dt>経度</dt>
    <dd id="longitude">-</dd>

    <dt>位置精度</dt>
    <dd id="accuracy">-</dd>

    <dt>取得時刻</dt>
    <dd id="time">-</dd>
  </dl>

  <p class="note">
    このページでは、動作確認のため端末内に現在地を表示します。
    現在地を外部へ送信・保存する機能はありません。
  </p>

  <script>
    let watchId = null;

    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");

    startButton.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "このブラウザは位置情報の取得に対応していません。";
        return;
      }

      statusElement.textContent = "位置情報を取得しています…";

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          document.getElementById("latitude").textContent =
            position.coords.latitude.toFixed(6);

          document.getElementById("longitude").textContent =
            position.coords.longitude.toFixed(6);

          document.getElementById("accuracy").textContent =
            Math.round(position.coords.accuracy) + "m";

          document.getElementById("time").textContent =
            new Date(position.timestamp).toLocaleString("ja-JP");

          statusElement.textContent = "位置情報を取得中";
        },

        (error) => {
          const messages = {
            1: "位置情報の利用が許可されていません。",
            2: "現在地を取得できませんでした。",
            3: "位置情報の取得がタイムアウトしました。"
          };

          statusElement.textContent =
            messages[error.code] ||
            "位置情報の取得中にエラーが発生しました。";
        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );

      startButton.disabled = true;
      stopButton.disabled = false;
    });

    stopButton.addEventListener("click", () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      statusElement.textContent = "停止中";
      startButton.disabled = false;
      stopButton.disabled = true;
    });
  </script>
</body>
</html>
