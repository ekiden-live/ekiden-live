    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDateTime(value) {
      if (!value) {
        return "-";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return date.toLocaleString("ja-JP");
    }

    function formatElapsedTime(value) {
      if (!value) {
        return "-";
      }

      const time =
        new Date(value).getTime();

      if (!Number.isFinite(time)) {
        return "-";
      }

      const elapsed =
        Math.max(0, Date.now() - time);

      const seconds =
        Math.floor(elapsed / 1000);

      if (seconds < 60) {
        return seconds + "秒前";
      }

      const minutes =
        Math.floor(seconds / 60);

      if (minutes < 60) {
        return minutes + "分前";
      }

      const hours =
        Math.floor(minutes / 60);

      if (hours < 24) {
        return hours + "時間前";
      }

      const days =
        Math.floor(hours / 24);

      return days + "日前";
    }

    function getManagementStatusText(

        return false;
      }

      return (
        Date.now() - time >

      );

    function createCheckpointIcon(checkpoint) {

          team.colorCode === "#FFFFFF"
        ) {
          card.style.setProperty(
            "--team-color-border",
            "1px solid var(--border)"
          );
        }

        card.innerHTML =
          '<div class="team-card-header">' +
            '<div class="team-name">' +
              escapeHtml(team.name) +
              "（" +
              escapeHtml(team.colorName) +
              "）" +
            "</div>" +
            '<span class="status-badge status-unknown">' +
              "確認中" +
            "</span>" +
          "</div>";

        const target =
          team.className === "A"
            ? classAList
            : classBList;

        target.appendChild(card);

        teamCards.set(
          team.id,
          card
        );
      });
    }

    function buildQueryValueList() {
      return (
        "(" +
        TEAMS.map(function (team) {
          return (
            '"' +
            team.id.replaceAll(
              '"',
              '\\"'
            ) +
            '"'
          );
        }).join(",") +
        ")"
      );
    }

    async function fetchJson(endpoint) {
      const response =
        await fetch(endpoint, {
          method: "GET",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization:
              "Bearer " +
              SUPABASE_KEY,
            Accept:
              "application/json",
            "Accept-Profile":
              "public"
          },
          cache: "no-store"
        });

      if (!response.ok) {
        const responseText =
          await response.text();

        throw new Error(
          "HTTP " +
          response.status +
          ": " +
          responseText
        );
      }

      return await response.json();
    }

    async function fetchTeamStatuses() {
      const endpoint =
        SUPABASE_URL +
        "/rest/v1/team_status" +
        "?select=team_id%2Cstatus" +
        "%2Cfinished_at" +
        "&team_id=in." +
        encodeURIComponent(
          buildQueryValueList()
        );

      return await fetchJson(endpoint);
    }

    async function fetchLatestLocations() {
      const endpoint =
        SUPABASE_URL +
        "/rest/v1/team_locations" +
        "?select=team_id%2Clatitude" +
        "%2Clongitude%2Caccuracy" +
        "%2Crecorded_at" +
        "&team_id=in." +
        encodeURIComponent(
          buildQueryValueList()
        ) +
        "&order=team_id.asc" +
        "%2Crecorded_at.desc" +
        "&limit=5000";

      const rows =
        await fetchJson(endpoint);

      const latestByTeam = new Map();

      rows.forEach(function (row) {
        if (
          teamById.has(row.team_id) &&
          !latestByTeam.has(row.team_id)
        ) {
          latestByTeam.set(
            row.team_id,
            row
          );
        }
      });

      return latestByTeam;
    }

    function combineTeamData(
      statusRows,
      latestLocations
    ) {
      const statusByTeam = new Map();

      statusRows.forEach(function (row) {
        statusByTeam.set(
          row.team_id,
          row
        );
      });

      const combined = new Map();

      TEAMS.forEach(function (team) {
        const statusRow =
          statusByTeam.get(team.id);

        const location =
          latestLocations.get(
            team.id
          ) || null;

        combined.set(team.id, {
          team: team,
          status:
            statusRow?.status ||
            "unknown",
          finishedAt:
            statusRow?.finished_at ||
            null,
          location: location
        });
      });

      return combined;
    }

    function createMarkerIcon(state) {
      const team = state.team;

      const wrapperClasses = [
        "marker-wrapper"
      ];

      if (state.status === "finished") {
        wrapperClasses.push(
          "marker-finished"
        );
      }

      if (
        isLocationStale(
          state.location?.recorded_at
        )
      ) {
        wrapperClasses.push(
          "marker-stale"
        );
      }

      const html =
        '<div class="' +
          wrapperClasses.join(" ") +
        '">' +
          '<span class="marker-dot" style="' +
            "background:" +
            escapeHtml(
              team.colorCode
            ) +
            '"></span>' +
          '<span class="marker-label">' +
            escapeHtml(team.name) +
          "</span>" +
        "</div>";

      return L.divIcon({
        className: "map-team-icon",
        html: html,
        iconSize: [165, 52],
        iconAnchor: [13, 16],
        popupAnchor: [0, -17]
      });
    }

    function createPopupHtml(state) {
      const team = state.team;
      const location = state.location;

      const accuracy =
        Number(location?.accuracy);

      const accuracyText =
        Number.isFinite(accuracy)
          ? "約" +
            Math.round(accuracy) +
            "m"
          : "-";

      let finishedText = "";

      if (state.status === "finished") {
        finishedText =
          "<br>ゴール日時: " +
          escapeHtml(
            formatDateTime(
              state.finishedAt
            )
          );
      }

      return (
        "<strong>" +
          escapeHtml(team.name) +
        "</strong><br>" +
        escapeHtml(team.className) +
        "クラス・" +
        escapeHtml(team.colorName) +
        "<br>管理状態: " +
        escapeHtml(
          getManagementStatusText(
            state.status
          )
        ) +
        finishedText +
        "<br>最終送信: " +
        escapeHtml(
          formatDateTime(
            location?.recorded_at
          )
        ) +
        "<br>経過時間: " +
        escapeHtml(
          formatElapsedTime(
            location?.recorded_at
          )
        ) +
        "<br>位置精度: " +
        escapeHtml(accuracyText)
      );
    }

    function updateMapMarker(state) {
      const team = state.team;
      const location = state.location;

      if (!location) {
        const oldMarker =
          markers.get(team.id);

        if (oldMarker) {
          map.removeLayer(oldMarker);
          markers.delete(team.id);
        }

        const oldCircle =
          accuracyCircles.get(
            team.id
          );

        if (oldCircle) {
          map.removeLayer(oldCircle);
          accuracyCircles.delete(
            team.id
          );
        }

        return;
      }

      const latitude =
        Number(location.latitude);

      const longitude =
        Number(location.longitude);

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        return;
      }

      const position = [
        latitude,
        longitude
      ];

      let marker =
        markers.get(team.id);

      if (!marker) {
        marker = L.marker(
          position,
          {
            icon:
              createMarkerIcon(state),
            zIndexOffset:
              state.status ===
              "finished"
                ? 500
                : 0
          }
        ).addTo(map);

        markers.set(
          team.id,
          marker
        );
      } else {
        marker.setLatLng(position);

        marker.setIcon(
          createMarkerIcon(state)
        );

        marker.setZIndexOffset(
          state.status === "finished"
            ? 500
            : 0
        );
      }

      marker.bindPopup(
        createPopupHtml(state)
      );

      const accuracy =
        Number(location.accuracy);

      let circle =
        accuracyCircles.get(team.id);

      if (
        Number.isFinite(accuracy) &&
        accuracy > 0
      ) {
        if (!circle) {
          circle = L.circle(
            position,
            {
              radius: accuracy,
              color: team.colorCode,
              weight: 1,
              opacity: 0.55,
              fillColor:
                team.colorCode,
              fillOpacity: 0.08
            }
          ).addTo(map);

          accuracyCircles.set(
            team.id,
            circle
          );
        } else {
          circle.setLatLng(position);
          circle.setRadius(accuracy);

          circle.setStyle({
            color: team.colorCode,
            fillColor:
              team.colorCode
          });
        }
      } else if (circle) {
        map.removeLayer(circle);

        accuracyCircles.delete(
          team.id
        );
      }
    }

    function updateTeamCard(state) {
      const card =
        teamCards.get(state.team.id);

      if (!card) {
        return;
      }

      const statusBadge =
        card.querySelector(
          ".status-badge"
        );

      if (!statusBadge) {
        return;
      }

      statusBadge.className =
        "status-badge " +
        getManagementStatusClass(
          state.status
        );

      statusBadge.textContent =
        getManagementStatusText(
          state.status
        );
    }

    function renderAllTeams(
      combinedState
    ) {
      combinedState.forEach(
        function (state) {
          updateTeamCard(state);
          updateMapMarker(state);
        }
      );
    }

    function getAvailablePositions() {
  const positions =
    CHECKPOINTS.map(
      function (checkpoint) {
        return [
          checkpoint.latitude,
          checkpoint.longitude
        ];
      }
    );

  latestStateByTeam.forEach(
    function (state) {
      const location =
        state.location;

      if (!location) {
        return;
      }

      const latitude =
        Number(location.latitude);

      const longitude =
        Number(location.longitude);

      if (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude)
      ) {
        positions.push([
          latitude,
          longitude
        ]);
      }
    }
  );

  return positions;
}

    function fitAllTeams() {
      const positions =
        getAvailablePositions();

      if (positions.length === 0) {
        map.setView(
          DEFAULT_MAP_CENTER,
          DEFAULT_MAP_ZOOM
        );

        return;
      }

      if (positions.length === 1) {
        map.setView(
          positions[0],
          15
        );

        return;
      }

      const bounds =
        L.latLngBounds(positions);

      map.fitBounds(bounds, {
        padding: [45, 45],
        maxZoom: 16
      });
    }

    async function refreshAllData() {
      if (isRefreshing) {
        return;
      }

      isRefreshing = true;
      refreshButton.disabled = true;

      overallStatusElement.textContent =
        "最新データを取得しています...";

      try {
        if (
          !SUPABASE_KEY.startsWith(
            "sb_publishable_"
          )
        ) {
          throw new Error(
            "Publishable keyが設定されていません。"
          );
        }

        const results =
          await Promise.all([
            fetchTeamStatuses(),
            fetchLatestLocations()
          ]);

        latestStateByTeam =
          combineTeamData(
            results[0],
            results[1]
          );

        renderAllTeams(
          latestStateByTeam
        );

        lastSuccessfulRefreshAt =
          new Date();

        const locationCount =
          Array.from(
            latestStateByTeam.values()
          ).filter(function (state) {
            return Boolean(
              state.location
            );
          }).length;

        overallStatusElement.innerHTML =
          "<strong>更新完了:</strong> " +
          escapeHtml(
            lastSuccessfulRefreshAt
              .toLocaleString(
                "ja-JP"
              )
          ) +
          "<br>位置確認済み: " +
          locationCount +
          " / " +
          TEAMS.length +
          "チーム・30秒ごとに自動更新";

        if (!hasFittedInitially) {
          window.setTimeout(
            function () {
              map.invalidateSize();
              fitAllTeams();

              hasFittedInitially =
                true;
            },
            300
          );
        } else {
          map.invalidateSize();
        }
      } catch (error) {
        console.error(error);

        overallStatusElement.innerHTML =
          '<span class="error-message">' +
            "データを取得できませんでした: " +
            escapeHtml(
              error.message
            ) +
          "</span>" +
          (
            lastSuccessfulRefreshAt
              ? "<br>最後の正常更新: " +
                escapeHtml(
                  lastSuccessfulRefreshAt
                    .toLocaleString(
                      "ja-JP"
                    )
                )
              : ""
          );
      } finally {
        isRefreshing = false;
        refreshButton.disabled = false;
      }
    }

    createCheckpointMarkers();
    createTeamCards();

refreshButton.addEventListener(

      "click",
      refreshAllData
    );

    window.setTimeout(
      function () {
        map.invalidateSize();
      },
      200
    );

    refreshAllData();

    window.setInterval(
      refreshAllData,
      REFRESH_INTERVAL_MS
    );

    let resizeTimer = null;

    window.addEventListener(
      "resize",
      function () {
        if (resizeTimer !== null) {
          window.clearTimeout(
            resizeTimer
          );
        }

        resizeTimer =
          window.setTimeout(
            function () {
              map.invalidateSize();
            },
            200
          );
      }
    );

    window.addEventListener(
      "orientationchange",
      function () {
        window.setTimeout(
          function () {
            map.invalidateSize();
            fitAllTeams();
          },
          400
        );
      }
    );
  </script>
</body>
</html>
