<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>駅伝GPS地図表示試験</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      max-width: 800px;
      margin: auto;
      padding: 16px;
      font-family: sans-serif;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      font-size: 17px;
    }

    #status {
      padding: 12px;
      background: #f2f2f2;
      border-left: 5px solid #777;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 55vh;
      min-height: 350px;
      border: 1px solid #aaa;
    }

    #details {
      padding: 10px;
      margin-top: 10px;
      background: #f7f7f7;
    }

    .note {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>駅伝GPS地図表示試験</h1>

  <button id="start" type="button">位置取得を開始</button>
  <button id="stop" type="button" disabled>位置取得を停止</button>

  <p id="status">停止中</p>

  <div id="map"></div>

  <div id="details">
    <div>位置精度：<span id="accuracy">-</span></div>
    <div>取得時刻：<span id="time">-</span></div>
  </div>

  <p class="note">
    青い印はGPSによる参考位置です。測位環境により誤差が生じます。
    この試験ページは、位置情報を外部へ送信・保存しません。
  </p>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    let watchId = null;
    let marker = null;
    let accuracyCircle = null;
    let firstPosition = true;

    const statusElement = document.getElementById("status");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");

    const map = L.map("map").setView([31.6, 130.6], 9);

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    startButton.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "このブラウザは位置情報取得に対応していません。";
        return;
      }

      statusElement.textContent = "位置情報を取得しています…";
      firstPosition = true;

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          const currentPosition = [latitude, longitude];

          if (marker === null) {
            marker = L.marker(currentPosition)
              .addTo(map)
              .bindPopup("現在地");

            accuracyCircle = L.circle(currentPosition, {
              radius: accuracy,
              color: "#136aec",
              fillColor: "#136aec",
              fillOpacity: 0.15
            }).addTo(map);
          } else {
            marker.setLatLng(currentPosition);
            accuracyCircle.setLatLng(currentPosition);
            accuracyCircle.setRadius(accuracy);
          }

          if (firstPosition) {
            map.setView(currentPosition, 17);
            marker.openPopup();
            firstPosition = false;
          } else {
            map.panTo(currentPosition);
          }

          document.getElementById("accuracy").textContent =
            Math.round(accuracy) + "m";

          document.getElementById("time").textContent =
            new Date(position.timestamp).toLocaleString("ja-JP");

          statusElement.textContent = "位置情報を取得中";
        },

        (error) => {
          const messages = {
            1: "位置情報の利用が許可されていません。",
            2: "現在地を取得できませんでした。",
            3: "位置情報の取得がタイムアウトしました。"
          };

          statusElement.textContent =
            messages[error.code] ||
            "位置情報の取得中にエラーが発生しました。";
        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );

      startButton.disabled = true;
      stopButton.disabled = false;
    });

    stopButton.addEventListener("click", () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      statusElement.textContent = "停止中";
      startButton.disabled = false;
      stopButton.disabled = true;
    });
  </script>
  
  <hr>

<h2>別端末用テスト位置</h2>
<p id="remote-status">Supabaseから読み込み中…</p>
<div id="remote-map"></div>

<style>
  #remote-map {
    width: 100%;
    height: 45vh;
    min-height: 300px;
    border: 1px solid #aaa;
  }
</style>

<script>
  const SUPABASE_URL = "https://tmxmmikcgzdcyyotkiex.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_dSckTd34uKOP-zWHbfMsTg_pr74IBgb";

  const remoteMap = L.map("remote-map").setView([31.906, 130.455], 14);

  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
  ).addTo(remoteMap);

  async function loadRemoteLocation() {
    const status = document.getElementById("remote-status");

    try {
      const endpoint =
        SUPABASE_URL +
        "/rest/v1/team_locations" +
        "?select=team_id,latitude,longitude,accuracy,recorded_at" +
        "&team_id=eq.test-a" +
        "&order=recorded_at.desc" +
        "&limit=1";

      const response = await fetch(endpoint, {
        method: "GET",
        headers: {
          apikey: SUPABASE_KEY
        }
      });

      if (!response.ok) {
        const message = await response.text();
        throw new Error(
          "HTTP " + response.status + ": " + message
        );
      }

      const rows = await response.json();

      if (rows.length === 0) {
        status.textContent = "test-aの位置データがありません。";
        return;
      }

      const row = rows[0];
      const point = [row.latitude, row.longitude];

      L.marker(point)
        .addTo(remoteMap)
        .bindPopup(
          "チーム：" + row.team_id +
          "<br>精度：約" +
          (row.accuracy === null ? "不明" : Math.round(row.accuracy) + "m") +
          "<br>更新：" +
          new Date(row.recorded_at).toLocaleString("ja-JP")
        )
        .openPopup();

      if (row.accuracy !== null) {
        L.circle(point, {
          radius: row.accuracy,
          color: "#d93636",
          fillColor: "#d93636",
          fillOpacity: 0.15
        }).addTo(remoteMap);
      }

      remoteMap.setView(point, 17);
      status.textContent = "Supabaseからテスト位置を取得しました。";
    } catch (error) {
      console.error(error);
      status.textContent =
        "位置を取得できませんでした：" + error.message;
    }
  }

  loadRemoteLocation();
</script>

</body>
</html>
