<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>位置情報自動送信</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      color: #222;
      background: #f5f7f9;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      padding: 18px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }

    p {
      line-height: 1.7;
    }

    #status {
      min-height: 3em;
      padding: 12px;
      overflow-wrap: anywhere;
      background: #f2f2f2;
      border-radius: 6px;
    }

    #details {
      margin-top: 12px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 6px;
      line-height: 1.8;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      min-height: 52px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #startButton {
      background: #1769aa;
    }

    #stopButton {
      background: #b42318;
    }

    .success {
      color: #075f23;
      background: #effff3 !important;
    }

    .error {
      color: #b00020;
      background: #fff0f0 !important;
    }

    .running {
      color: #084f83;
      background: #eef8ff !important;
    }

    .notice {
      margin-top: 16px;
      padding: 12px;
      font-size: 0.9rem;
      background: #fff8df;
      border-radius: 6px;
    }

    a {
      color: #075ea8;
    }

    @media (max-width: 430px) {
      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>位置情報自動送信</h1>

      <p>
        開始ボタンを押すと、30秒ごとに現在位置を取得し送信します。
      </p>

      <p id="status">
        「自動送信を開始」を押してください。
      </p>

      <div id="details">
        チーム: -<br>
        送信回数: 0回<br>
        最終送信: -<br>
        精度: -
      </div>

      <div class="button-row">
        <button id="startButton" type="button">
          自動送信を開始
        </button>

        <button id="stopButton" type="button" disabled>
          自動送信を停止
        </button>
      </div>

      <div class="notice">
        <strong>注意:</strong>
        送信中はこのページを開いたままにしてください。
        画面ロック、別アプリへの切替、省電力機能などにより、
        自動送信が止まる場合があります。
        使用終了時は必ず停止ボタンを押してください。
      </div>

      <p>
        <a href="./index.html">閲覧用地図を開く</a>
      </p>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://tmxmmikcgzdcyyotkiex.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dSckTd34uKOP-zWHbfMsTg_pr74IBgb";

    const TEAM_ID = "鶴田A";

    const SEND_INTERVAL_MS = 30000;

    const statusElement =
      document.getElementById("status");

    const detailsElement =
      document.getElementById("details");

    const startButton =
      document.getElementById("startButton");

    const stopButton =
      document.getElementById("stopButton");

    let intervalId = null;
    let isRunning = false;
    let isSending = false;
    let sentCount = 0;
    let lastPosition = null;
    let lastSentAt = null;

    function setStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className = type || "";
    }

    function updateDetails() {
      let accuracyText = "-";

      if (
        lastPosition &&
        Number.isFinite(lastPosition.coords.accuracy)
      ) {
        accuracyText =
          "約" +
          Math.round(lastPosition.coords.accuracy) +
          "m";
      }

      const sentAtText =
        lastSentAt
          ? lastSentAt.toLocaleString("ja-JP")
          : "-";

      detailsElement.innerHTML =
        "チーム: " +
        escapeHtml(TEAM_ID) +
        "<br>送信回数: " +
        sentCount +
        "回" +
        "<br>最終送信: " +
        escapeHtml(sentAtText) +
        "<br>精度: " +
        escapeHtml(accuracyText);
    }

    function getCurrentPosition() {
      return new Promise(function (resolve, reject) {
        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 10000
          }
        );
      });
    }

    async function insertLocation(position) {
      const endpoint =
        SUPABASE_URL +
        "/rest/v1/team_locations";

      const payload = {
        team_id: TEAM_ID,
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy,
        recorded_at: new Date().toISOString()
      };

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          Accept: "application/json",
          "Content-Profile": "public",
          Prefer: "return=minimal"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const responseText =
          await response.text();

        throw new Error(
          "HTTP " +
          response.status +
          ": " +
          responseText
        );
      }
    }

    function getLocationErrorMessage(error) {
      if (!error) {
        return "位置情報を取得できませんでした。";
      }

      switch (error.code) {
        case 1:
          return "位置情報の利用が許可されていません。";

        case 2:
          return "現在位置を特定できませんでした。";

        case 3:
          return "位置情報の取得が時間切れになりました。";

        default:
          return (
            error.message ||
            "位置情報を取得できませんでした。"
          );
      }
    }

    async function sendLocationOnce() {
      if (!isRunning || isSending) {
        return;
      }

      isSending = true;

      try {
        setStatus(
          "現在位置を取得して送信しています...",
          "running"
        );

        let position;

        try {
          position =
            await getCurrentPosition();
        } catch (locationError) {
          throw new Error(
            getLocationErrorMessage(locationError)
          );
        }

        await insertLocation(position);

        lastPosition = position;
        lastSentAt = new Date();
        sentCount += 1;

        updateDetails();

        setStatus(
          "自動送信中です。30秒後に再送信します。",
          "success"
        );
      } catch (error) {
        console.error(error);

        setStatus(
          "今回の送信に失敗しました: " +
          error.message +
          " 30秒後に再試行します。",
          "error"
        );
      } finally {
        isSending = false;
      }
    }

    async function startAutomaticSending() {
      if (isRunning) {
        return;
      }

      try {
        if (
          !SUPABASE_KEY.startsWith(
            "sb_publishable_"
          )
        ) {
          throw new Error(
            "Publishable keyを入力してください。"
          );
        }

        if (!window.isSecureContext) {
          throw new Error(
            "位置情報の取得にはHTTPS接続が必要です。"
          );
        }

        if (!navigator.geolocation) {
          throw new Error(
            "この端末またはブラウザは位置情報取得に対応していません。"
          );
        }

        isRunning = true;
        sentCount = 0;
        lastPosition = null;
        lastSentAt = null;

        startButton.disabled = true;
        stopButton.disabled = false;

        updateDetails();

        setStatus(
          "自動送信を開始します...",
          "running"
        );

        await sendLocationOnce();

        intervalId = window.setInterval(
          sendLocationOnce,
          SEND_INTERVAL_MS
        );
      } catch (error) {
        console.error(error);

        isRunning = false;
        startButton.disabled = false;
        stopButton.disabled = true;

        setStatus(
          "開始できませんでした: " +
          error.message,
          "error"
        );
      }
    }

    function stopAutomaticSending() {
      isRunning = false;

      if (intervalId !== null) {
        window.clearInterval(intervalId);
        intervalId = null;
      }

      startButton.disabled = false;
      stopButton.disabled = true;

      setStatus(
        "自動送信を停止しました。",
        ""
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    startButton.addEventListener(
      "click",
      startAutomaticSending
    );

    stopButton.addEventListener(
      "click",
      stopAutomaticSending
    );

    window.addEventListener(
      "beforeunload",
      function () {
        if (intervalId !== null) {
          window.clearInterval(intervalId);
        }
      }
    );

    updateDetails();
  </script>
</body>
</html>
